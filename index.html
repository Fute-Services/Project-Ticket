<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket Raising System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --border: #dde1e6;
    --text: #1a1d23;
    --text-dim: #5c6470;
    --accent: #1e4ed8;
    --accent-contrast: #ffffff;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(20,25,35,.05), 0 4px 12px rgba(20,25,35,.04);
    --crit: #c0272d;
    --high: #b5540a;
    --med: #a17700;
    --low: #1c7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f24;
      --surface-2: #23262c;
      --border: #2f333a;
      --text: #eceef1;
      --text-dim: #9aa1ac;
      --accent: #5b8dff;
      --accent-contrast: #0e1013;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif;
    margin: 0; height: 100vh; display: grid;
    grid-template-rows: auto 1fr; background: var(--bg); color: var(--text);
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 6px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  header h1 { font-size: 15.5px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  header .sub { font-size: 12px; color: var(--text-dim); margin-left: 3px; font-weight: 400; }
  header .spacer { flex: 1; }

  .layout { display: flex; overflow: hidden; }

  aside {
    width: 300px; border-right: 1px solid var(--border); overflow-y: auto;
    flex-shrink: 0; background: var(--surface); padding: 14px;
  }
  aside .aside-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding: 0 2px;
  }
  aside .aside-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 0; font-weight: 600; }
  aside .count { font-size: 11px; color: var(--text-dim); background: var(--surface-2); padding: 1px 7px; border-radius: 999px; }

  #ticketList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #ticketList li {
    padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
    border: 1px solid transparent; display: flex; gap: 8px; align-items: flex-start;
    transition: background .12s, border-color .12s;
  }
  #ticketList li:hover { background: var(--surface-2); }
  #ticketList li.active {
    background: var(--surface-2);
    border-color: var(--accent);
  }
  #ticketList .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  #ticketList .title { font-size: 13px; font-weight: 600; line-height: 1.3; }
  #ticketList .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  aside .empty-list { color: var(--text-dim); font-size: 13px; padding: 24px 8px; text-align: center; }

  main { flex: 1; overflow-y: auto; padding: 28px 32px; display: flex; justify-content: center; }
  .content { width: 100%; max-width: 680px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px;
  }

  h2 { font-size: 18px; margin: 0 0 18px; font-weight: 600; }

  form label { display: block; margin-top: 10px; font-weight: 600; font-size: 12px; color: var(--text-dim); }
  form input, form select, form textarea {
    width: 100%; padding: 6px 9px; margin-top: 3px;
    font: inherit; font-size: 13px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); transition: border-color .12s, box-shadow .12s;
  }
  form input:focus, form select:focus, form textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  form textarea { min-height: 40px; resize: vertical; font-family: inherit; }
  form small { display: block; margin-top: 3px; font-size: 10.5px; color: var(--text-dim); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }

  .btn {
    font: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; cursor: pointer;
    border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    transition: filter .12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { filter: brightness(0.96); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { color: var(--crit); }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .btn-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  form button.btn.primary { margin-top: 22px; width: 100%; padding: 11px; justify-content: center; }

  .ticket-view h2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ticket-view section { margin-bottom: 18px; }
  .ticket-view section:last-child { margin-bottom: 0; }
  .ticket-view section h3 {
    margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-dim); font-weight: 700;
  }
  .ticket-view section .value { font-size: 14px; line-height: 1.55; }
  .ticket-view ol, .ticket-view ul { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
  .env-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 13px; }
  .env-grid span { color: var(--text-dim); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--text-dim);
  }
  .badge.priority::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .p-critical { color: var(--crit); }
  .p-high { color: var(--high); }
  .p-medium { color: var(--med); }
  .p-low { color: var(--low); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-state .big { font-size: 32px; margin-bottom: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">T</div>
  <h1>Ticket Raising System<span class="sub"> · track bugs, features &amp; enhancements</span></h1>
  <div class="spacer"></div>
</header>

<div class="layout">
  <aside>
    <div class="aside-head">
      <h2>Tickets</h2>
      <span class="count" id="ticketCount">0</span>
    </div>
    <ul id="ticketList"></ul>
  </aside>

  <main><div class="content" id="main"></div></main>
</div>

<script>
const STORAGE_KEY = 'tickets';
const PRIORITY_CLASS = { Critical: 'p-critical', High: 'p-high', Medium: 'p-medium', Low: 'p-low' };
const PRIORITY_COLOR = { Critical: 'var(--crit)', High: 'var(--high)', Medium: 'var(--med)', Low: 'var(--low)' };

function loadTickets() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveTickets(tickets) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
}

let tickets = loadTickets();
let selectedId = null;

function linesToList(text) {
  return text.split('\n').map(s => s.trim()).filter(Boolean);
}

function ticketToMarkdown(t) {
  const steps = t.steps.length ? t.steps.map((s, i) => `${i + 1}. ${s}`).join('\n') : 'Not Provided';
  const criteria = t.criteria.length ? t.criteria.map(c => `- [ ] ${c}`).join('\n') : 'Not Provided';
  return `### Title\n${t.title || 'Not Provided'}\n\n` +
    `### Type\n${t.type || 'Not Provided'}\n\n` +
    `### Priority\n${t.priority || 'Not Provided'}\n\n` +
    `### Module\n${t.module || 'Not Provided'}\n\n` +
    `### Environment\n- Web / Mobile: ${t.platform || 'Not Provided'}\n- Browser: ${t.browser || 'Not Provided'}\n- OS: ${t.os || 'Not Provided'}\n- Build Version: ${t.build || 'Not Provided'}\n\n` +
    `### Description\n${t.description || 'Not Provided'}\n\n` +
    `### Steps to Reproduce\n${steps}\n\n` +
    `### Expected Result\n${t.expected || 'Not Provided'}\n\n` +
    `### Actual Result\n${t.actual || 'Not Provided'}\n\n` +
    `### Impact\n${t.impact || 'Not Provided'}\n\n` +
    `### Acceptance Criteria\n${criteria}\n\n` +
    `### Attachments\n${t.attachments || 'Not Provided'}`;
}

function renderList() {
  const list = document.getElementById('ticketList');
  document.getElementById('ticketCount').textContent = tickets.length;
  if (!tickets.length) {
    list.innerHTML = '<div class="empty-list">No tickets yet</div>';
    return;
  }
  list.innerHTML = '';
  tickets.forEach(t => {
    const li = document.createElement('li');
    li.className = t.id === selectedId ? 'active' : '';
    li.innerHTML = `
      <span class="dot" style="background:${PRIORITY_COLOR[t.priority] || 'var(--text-dim)'}"></span>
      <div>
        <div class="title">${escapeHtml(t.title) || '(untitled)'}</div>
        <div class="meta">${escapeHtml(t.type) || 'Not Provided'}${t.priority ? ' · ' + escapeHtml(t.priority) : ''}</div>
      </div>`;
    li.onclick = () => { selectedId = t.id; render(); };
    list.appendChild(li);
  });
}

function renderForm() {
  document.getElementById('main').innerHTML = `
    <div class="card">
      <h2>Raise a Ticket</h2>
      <form id="ticketForm">
        <label>Title</label>
        <input name="title" placeholder="Short descriptive title" required>

        <label>Type</label>
        <select name="type">
          <option>Bug</option><option>Feature Request</option><option>Enhancement</option>
          <option>Improvement</option><option>UI/UX</option><option>Performance</option><option>Security</option>
        </select>

        <label>Description</label>
        <textarea name="description" placeholder="What's the issue or requirement?" required></textarea>

        <button type="submit" class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Create Ticket
        </button>
      </form>
    </div>
  `;
  document.getElementById('ticketForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const ticket = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2),
      title: f.get('title').trim(),
      type: f.get('type'),
      priority: '',
      module: '',
      platform: '',
      browser: '',
      os: '',
      build: '',
      description: f.get('description').trim(),
      steps: [],
      expected: '',
      actual: '',
      impact: '',
      criteria: [],
      attachments: '',
    };
    tickets.unshift(ticket);
    saveTickets(tickets);
    selectedId = ticket.id;
    render();
  };
}

function renderTicketView(t) {
  const steps = t.steps.length ? `<ol>${t.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>` : '<span class="value">Not Provided</span>';
  const criteria = t.criteria.length ? `<ul>${t.criteria.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>` : '<span class="value">Not Provided</span>';
  const pClass = PRIORITY_CLASS[t.priority] || '';
  document.getElementById('main').innerHTML = `
    <div class="btn-row">
      <button id="newBtn" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New Ticket
      </button>
      <button id="copyBtn" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        Copy as Markdown
      </button>
      <button id="deleteBtn" class="btn danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>
        Delete
      </button>
    </div>
    <div class="card ticket-view">
      <h2>
        ${escapeHtml(t.title) || '(untitled)'}
        <span class="badge">${escapeHtml(t.type) || 'Not Provided'}</span>
        ${t.priority ? `<span class="badge priority ${pClass}">${escapeHtml(t.priority)}</span>` : ''}
      </h2>

      <section><h3>Module</h3><div class="value">${escapeHtml(t.module) || 'Not Provided'}</div></section>
      <section><h3>Environment</h3>
        <div class="env-grid">
          <div><span>Web/Mobile:</span> ${escapeHtml(t.platform) || 'Not Provided'}</div>
          <div><span>Browser:</span> ${escapeHtml(t.browser) || 'Not Provided'}</div>
          <div><span>OS:</span> ${escapeHtml(t.os) || 'Not Provided'}</div>
          <div><span>Build:</span> ${escapeHtml(t.build) || 'Not Provided'}</div>
        </div>
      </section>
      <section><h3>Description</h3><div class="value">${escapeHtml(t.description) || 'Not Provided'}</div></section>
      <section><h3>Steps to Reproduce</h3>${steps}</section>
      <section><h3>Expected Result</h3><div class="value">${escapeHtml(t.expected) || 'Not Provided'}</div></section>
      <section><h3>Actual Result</h3><div class="value">${escapeHtml(t.actual) || 'Not Provided'}</div></section>
      <section><h3>Impact</h3><div class="value">${escapeHtml(t.impact) || 'Not Provided'}</div></section>
      <section><h3>Acceptance Criteria</h3>${criteria}</section>
      <section><h3>Attachments</h3><div class="value">${escapeHtml(t.attachments) || 'Not Provided'}</div></section>
    </div>
  `;
  document.getElementById('newBtn').onclick = () => { selectedId = null; render(); };
  document.getElementById('deleteBtn').onclick = () => {
    tickets = tickets.filter(x => x.id !== t.id);
    saveTickets(tickets);
    selectedId = null;
    render();
  };
  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard.writeText(ticketToMarkdown(t));
    const btn = document.getElementById('copyBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  };
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  renderList();
  const t = tickets.find(x => x.id === selectedId);
  if (t) renderTicketView(t);
  else renderForm();
}

render();

// ponytail: minimal self-check for the markdown formatter, run via index.html?test=1
if (location.search.includes('test=1')) {
  const md = ticketToMarkdown({
    title: 'Sample', type: 'Bug', priority: 'High', module: 'Login',
    platform: 'Web', browser: '', os: '', build: '',
    description: 'desc', steps: ['Open page', 'Click button'],
    expected: 'works', actual: 'fails', impact: 'blocks users',
    criteria: ['Fixed'], attachments: ''
  });
  console.assert(md.includes('1. Open page'), 'steps should be numbered');
  console.assert(md.includes('- [ ] Fixed'), 'criteria should be checklist');
  console.assert(md.includes('Browser: Not Provided'), 'missing fields should say Not Provided');

  const minimal = ticketToMarkdown({
    title: 'Only title/type/desc', type: 'Bug', priority: '', module: '',
    platform: '', browser: '', os: '', build: '',
    description: 'desc', steps: [], expected: '', actual: '', impact: '',
    criteria: [], attachments: ''
  });
  console.assert(minimal.includes('### Priority\nNot Provided'), 'blank priority (small-form path) should say Not Provided');
  console.log('self-test done — check console.assert output above for failures');
}
</script>
</body>
</html>
