<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket Raising System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  aside { width: 320px; border-right: 1px solid #8884; overflow-y: auto; flex-shrink: 0; }
  aside h2 { padding: 12px 16px 0; margin: 0; font-size: 15px; }
  #ticketList { list-style: none; margin: 0; padding: 8px; }
  #ticketList li { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
  #ticketList li:hover { background: #8882; }
  #ticketList li.active { background: #4a90e233; }
  #ticketList .meta { font-size: 12px; opacity: .7; }
  main { flex: 1; overflow-y: auto; padding: 24px; max-width: 720px; }
  form label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; }
  form input, form select, form textarea {
    width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px;
    font: inherit; border-radius: 4px; border: 1px solid #8886;
  }
  form textarea { min-height: 60px; resize: vertical; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
  .ticket-view h2 { margin-top: 0; }
  .ticket-view section { margin-bottom: 14px; }
  .ticket-view section h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; opacity: .7; }
  .ticket-view ol, .ticket-view ul { margin: 4px 0; padding-left: 22px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #8882; }
  .empty { opacity: .6; padding: 40px; text-align: center; }
</style>
</head>
<body>

<aside>
  <h2>Tickets</h2>
  <ul id="ticketList"></ul>
</aside>

<main id="main"></main>

<script>
const STORAGE_KEY = 'tickets';

function loadTickets() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveTickets(tickets) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
}

let tickets = loadTickets();
let selectedId = null;

function linesToList(text) {
  return text.split('\n').map(s => s.trim()).filter(Boolean);
}

function ticketToMarkdown(t) {
  const steps = t.steps.length ? t.steps.map((s, i) => `${i + 1}. ${s}`).join('\n') : 'Not Provided';
  const criteria = t.criteria.length ? t.criteria.map(c => `- [ ] ${c}`).join('\n') : 'Not Provided';
  return `### Title\n${t.title || 'Not Provided'}\n\n` +
    `### Type\n${t.type}\n\n` +
    `### Priority\n${t.priority}\n\n` +
    `### Module\n${t.module || 'Not Provided'}\n\n` +
    `### Environment\n- Web / Mobile: ${t.platform || 'Not Provided'}\n- Browser: ${t.browser || 'Not Provided'}\n- OS: ${t.os || 'Not Provided'}\n- Build Version: ${t.build || 'Not Provided'}\n\n` +
    `### Description\n${t.description || 'Not Provided'}\n\n` +
    `### Steps to Reproduce\n${steps}\n\n` +
    `### Expected Result\n${t.expected || 'Not Provided'}\n\n` +
    `### Actual Result\n${t.actual || 'Not Provided'}\n\n` +
    `### Impact\n${t.impact || 'Not Provided'}\n\n` +
    `### Acceptance Criteria\n${criteria}\n\n` +
    `### Attachments\n${t.attachments || 'Not Provided'}`;
}

function renderList() {
  const list = document.getElementById('ticketList');
  list.innerHTML = '';
  tickets.forEach(t => {
    const li = document.createElement('li');
    li.className = t.id === selectedId ? 'active' : '';
    li.innerHTML = `<div>${t.title || '(untitled)'}</div><div class="meta">${t.type} · ${t.priority}</div>`;
    li.onclick = () => { selectedId = t.id; render(); };
    list.appendChild(li);
  });
}

function renderForm() {
  document.getElementById('main').innerHTML = `
    <h2>Raise a Ticket</h2>
    <form id="ticketForm">
      <label>Title</label>
      <input name="title" placeholder="Short descriptive title">

      <div class="row">
        <div>
          <label>Type</label>
          <select name="type">
            <option>Bug</option><option>Feature Request</option><option>Enhancement</option>
            <option>Improvement</option><option>UI/UX</option><option>Performance</option><option>Security</option>
          </select>
        </div>
        <div>
          <label>Priority</label>
          <select name="priority">
            <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
          </select>
        </div>
      </div>

      <label>Module</label>
      <input name="module" placeholder="Affected module or page">

      <div class="row">
        <div><label>Web / Mobile</label><input name="platform"></div>
        <div><label>Browser</label><input name="browser"></div>
      </div>
      <div class="row">
        <div><label>OS</label><input name="os"></div>
        <div><label>Build Version</label><input name="build"></div>
      </div>

      <label>Description</label>
      <textarea name="description"></textarea>

      <label>Steps to Reproduce (one per line)</label>
      <textarea name="steps"></textarea>

      <label>Expected Result</label>
      <textarea name="expected"></textarea>

      <label>Actual Result</label>
      <textarea name="actual"></textarea>

      <label>Impact</label>
      <textarea name="impact"></textarea>

      <label>Acceptance Criteria (one per line)</label>
      <textarea name="criteria"></textarea>

      <label>Attachments</label>
      <input name="attachments" placeholder="Links / filenames / notes">

      <button type="submit">Create Ticket</button>
    </form>
  `;
  document.getElementById('ticketForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const ticket = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2),
      title: f.get('title').trim(),
      type: f.get('type'),
      priority: f.get('priority'),
      module: f.get('module').trim(),
      platform: f.get('platform').trim(),
      browser: f.get('browser').trim(),
      os: f.get('os').trim(),
      build: f.get('build').trim(),
      description: f.get('description').trim(),
      steps: linesToList(f.get('steps')),
      expected: f.get('expected').trim(),
      actual: f.get('actual').trim(),
      impact: f.get('impact').trim(),
      criteria: linesToList(f.get('criteria')),
      attachments: f.get('attachments').trim(),
    };
    tickets.unshift(ticket);
    saveTickets(tickets);
    selectedId = ticket.id;
    render();
  };
}

function renderTicketView(t) {
  const steps = t.steps.length ? `<ol>${t.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>` : 'Not Provided';
  const criteria = t.criteria.length ? `<ul>${t.criteria.map(c => `<li>☐ ${escapeHtml(c)}</li>`).join('')}</ul>` : 'Not Provided';
  document.getElementById('main').innerHTML = `
    <div class="ticket-view">
      <button id="newBtn">+ New Ticket</button>
      <button id="deleteBtn">Delete</button>
      <button id="copyBtn">Copy as Markdown</button>
      <h2>${escapeHtml(t.title) || '(untitled)'} <span class="badge">${t.type}</span> <span class="badge">${t.priority}</span></h2>

      <section><h3>Module</h3>${escapeHtml(t.module) || 'Not Provided'}</section>
      <section><h3>Environment</h3>
        Web/Mobile: ${escapeHtml(t.platform) || 'Not Provided'}<br>
        Browser: ${escapeHtml(t.browser) || 'Not Provided'}<br>
        OS: ${escapeHtml(t.os) || 'Not Provided'}<br>
        Build: ${escapeHtml(t.build) || 'Not Provided'}
      </section>
      <section><h3>Description</h3>${escapeHtml(t.description) || 'Not Provided'}</section>
      <section><h3>Steps to Reproduce</h3>${steps}</section>
      <section><h3>Expected Result</h3>${escapeHtml(t.expected) || 'Not Provided'}</section>
      <section><h3>Actual Result</h3>${escapeHtml(t.actual) || 'Not Provided'}</section>
      <section><h3>Impact</h3>${escapeHtml(t.impact) || 'Not Provided'}</section>
      <section><h3>Acceptance Criteria</h3>${criteria}</section>
      <section><h3>Attachments</h3>${escapeHtml(t.attachments) || 'Not Provided'}</section>
    </div>
  `;
  document.getElementById('newBtn').onclick = () => { selectedId = null; render(); };
  document.getElementById('deleteBtn').onclick = () => {
    tickets = tickets.filter(x => x.id !== t.id);
    saveTickets(tickets);
    selectedId = null;
    render();
  };
  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard.writeText(ticketToMarkdown(t));
  };
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  renderList();
  const t = tickets.find(x => x.id === selectedId);
  if (t) renderTicketView(t);
  else renderForm();
}

render();

// ponytail: minimal self-check for the markdown formatter, run via index.html?test=1
if (location.search.includes('test=1')) {
  const md = ticketToMarkdown({
    title: 'Sample', type: 'Bug', priority: 'High', module: 'Login',
    platform: 'Web', browser: '', os: '', build: '',
    description: 'desc', steps: ['Open page', 'Click button'],
    expected: 'works', actual: 'fails', impact: 'blocks users',
    criteria: ['Fixed'], attachments: ''
  });
  console.assert(md.includes('1. Open page'), 'steps should be numbered');
  console.assert(md.includes('- [ ] Fixed'), 'criteria should be checklist');
  console.assert(md.includes('Browser: Not Provided'), 'missing fields should say Not Provided');
  console.log('self-test done — check console.assert output above for failures');
}
</script>
</body>
</html>
